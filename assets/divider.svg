<svg xmlns="http://www.w3.org/2000/svg" width="840" height="20" viewBox="0 0 840 20" role="img" aria-label="">
  <defs>
    <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fb950" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .line { stroke: #8b949e; stroke-opacity: .35; stroke-width: 1; }
    .dot { fill: #3fb950; }
    .scan { animation: move 4.5s ease-in-out infinite; }
    @keyframes move { from { transform: translateX(-160px); } to { transform: translateX(840px); } }
    @media (prefers-reduced-motion: reduce) { .scan { animation: none; opacity: 0; } }
  </style>
  <line class="line" x1="10" y1="10" x2="830" y2="10"/>
  <rect class="scan" x="0" y="9" width="160" height="2" rx="1" fill="url(#scan)"/>
  <circle class="dot" cx="6" cy="10" r="3"/>
  <circle class="dot" cx="834" cy="10" r="3"/>
</svg>
