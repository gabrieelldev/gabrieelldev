<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="Gabriel Aguilar Leal">
  <style>
    .bg { fill: #0d1117; }
    .name { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; letter-spacing: -0.5px; }
    .prompt { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #3fb950; }
    .type { font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #c9d1d9; }
    .cursor { fill: #3fb950; }
    .kw { fill: #d2a8ff; } .ty { fill: #ff7b72; } .str { fill: #a5d6ff; } .pl { fill: #c9d1d9; }
    .status { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .dot { fill: #3fb950; }
    .ring { fill: none; stroke: #3fb950; stroke-width: 2; transform-origin: 56px 172px; animation: ping 1.8s ease-out infinite; }
    .glow { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes blink { 50% { opacity: 0; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    @media (prefers-reduced-motion: reduce) { .ring, .glow, .blink { animation: none; } }
